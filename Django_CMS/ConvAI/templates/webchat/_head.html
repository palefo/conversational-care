{% comment %}
  What makes the web app chat installable: the manifest, the theme colour, the
  icon a home screen uses, and the service worker. Included by every /c/ page,
  so "Add to Home screen" works from whichever one the device is on.
{% endcomment %}
{% load static %}
<link rel="manifest" href="{% url 'webchat_manifest' %}">
<meta name="theme-color" content="#006877">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'app/images/webchat-icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'app/images/webchat-icon-192.png' %}">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register("{% url 'webchat_sw' %}", { scope: "{% url 'webchat_home' %}" }).catch(function(){});
    });
  }
</script>
