{% comment %}
  The WhatsApp-style chat look, shared by the tester chat
  (external_chat_with_audio.html) and the web app chat (webchat/chat.html) so
  the two cannot drift apart.
{% endcomment %}
<style>
  /* NOTE: classes are prefixed `wa-` on purpose, to stay isolated from the
     global .chat-container/.message/.message-bubble rules in app_new_design.css. */
  :root {
    --wa-header: #006877;          /* app primary 500 */
    --wa-header-dark: #084e59;
    --wa-bg: #e7ecef;              /* chat backdrop */
    --wa-panel: #f6f8f9;           /* input/footer bar */
    --wa-out-bubble: #d7e8ec;      /* outgoing (user) */
    --wa-out-text: #0b3238;
    --wa-in-bubble: #ffffff;       /* incoming (bot) */
    --wa-in-text: #1f2937;
    --wa-meta: #6b7b80;            /* timestamps */
    --wa-tick: #1f7b88;
    --wa-rec: #e11d48;             /* recording red */
    --wa-shadow: rgba(8, 78, 89, 0.10);
  }

  html, body { height: 100%; }
  body {
    padding: 0 !important; margin: 0;
    background: var(--wa-bg) !important;
    font-family: 'DM Sans', sans-serif;
    display: block !important;
  }

  .wa-chat {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-width: 900px; margin: 0 auto;
    background:
      radial-gradient(rgba(0,54,62,0.035) 1px, transparent 1px) 0 0 / 22px 22px,
      var(--wa-bg);
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
  }

  /* ---------- Header ---------- */
  .wa-topbar {
    background: linear-gradient(135deg, var(--wa-header), var(--wa-header-dark));
    color: #fff; padding: .7rem 1rem;
    display: flex; align-items: center; gap: .8rem;
    flex-shrink: 0; z-index: 5;
    box-shadow: 0 1px 6px rgba(0,0,0,0.12);
  }
  .wa-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; overflow: hidden;
  }
  .wa-avatar .material-icons-round { font-size: 26px; }
  .wa-headinfo { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .wa-headinfo .wa-title { font-size: 1.02rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wa-headinfo .wa-status { font-size: .76rem; opacity: .85; display: flex; align-items: center; gap: .3rem; }
  .wa-restart {
    margin-left: auto; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: .25rem;
    background: rgba(255,255,255,0.12); color: #fff;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 9999px;
    padding: .28rem .7rem .28rem .5rem; font-size: .78rem; font-weight: 500;
    cursor: pointer; opacity: .9;
  }
  .wa-restart:hover { background: rgba(255,255,255,0.22); opacity: 1; }
  .wa-restart:disabled { opacity: .45; cursor: default; }
  .wa-restart .material-icons-round { font-size: 17px; }
  .wa-headinfo .wa-status .wa-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; }

  /* ---------- Messages ---------- */
  .wa-thread {
    flex: 1; overflow-y: auto; padding: 1.1rem 1rem 1.3rem;
    display: flex; flex-direction: column; gap: .35rem;
    scroll-behavior: smooth;
  }
  .wa-empty {
    align-self: center; margin: auto 0;
    background: rgba(255,255,255,0.85); color: var(--wa-meta);
    padding: .55rem 1rem; border-radius: 14px; font-size: .82rem;
    box-shadow: 0 1px 3px var(--wa-shadow); text-align: center;
  }
  .wa-sysline {
    align-self: center; margin: .35rem auto; color: var(--wa-meta);
    font-size: .72rem; text-align: center; opacity: .85;
  }
  .wa-hint {
    text-align: center; color: var(--wa-meta); font-size: .68rem;
    opacity: .7; padding: .25rem 1rem .1rem;
  }
  .wa-hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* The resting state is visible and the animation supplies the arrival, rather
     than the element being declared at opacity:0 and relying on the animation to
     reveal it. Anything that suppresses animations — an extension, a print
     stylesheet, a browser that never fires them — then costs the arrival, not
     the conversation. */
  .wa-msg {
    display: flex; max-width: 78%; align-items: flex-start;
    animation: waFadeIn .28s ease-out both;
  }
  @keyframes waFadeIn { from { opacity: 0; transform: translateY(10px); } }
  .wa-msg.user { align-self: flex-end; }
  .wa-msg.bot  { align-self: flex-start; }
  .wa-msg + .wa-msg.user,
  .wa-msg + .wa-msg.bot { margin-top: .12rem; }

  .wa-bubble {
    position: relative;
    padding: .45rem .65rem .4rem;
    border-radius: 12px;
    line-height: 1.4; font-size: .95rem;
    word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap;
    box-shadow: 0 1px 1.5px var(--wa-shadow);
  }
  .wa-msg.bot  .wa-bubble { background: var(--wa-in-bubble);  color: var(--wa-in-text);  border-top-left-radius: 3px; }
  .wa-msg.user .wa-bubble { background: var(--wa-out-bubble); color: var(--wa-out-text); border-top-right-radius: 3px; }

  /* Bubble tail */
  .wa-msg.bot  .wa-bubble::before,
  .wa-msg.user .wa-bubble::before { content: ""; position: absolute; top: 0; width: 9px; height: 12px; }
  .wa-msg.bot  .wa-bubble::before { left: -6px;  background: radial-gradient(circle at bottom right, transparent 11px, var(--wa-in-bubble) 12px); }
  .wa-msg.user .wa-bubble::before { right: -6px; background: radial-gradient(circle at bottom left,  transparent 11px, var(--wa-out-bubble) 12px); }

  .wa-time {
    display: flex; align-items: center; justify-content: flex-end; gap: .2rem;
    font-size: .66rem; color: var(--wa-meta); margin-top: .1rem; line-height: 1; user-select: none;
  }
  .wa-msg.user .wa-time .material-icons-round { font-size: 15px; color: var(--wa-tick); }

  /* ---------- Audio bubble ---------- */
  .wa-bubble.wa-audiobubble { padding: .35rem .5rem; }
  /* Fixed, compact row. height + overflow:hidden guarantees the bubble stays
     short even if the browser gives the (control-less) <audio> element a box —
     Tailwind Preflight forces `audio { display:block }`, which otherwise reveals
     it and inflates the height. */
  .wa-audioplayer {
    display: flex; align-items: center; gap: .55rem;
    width: min(320px, 60vw); height: 42px; overflow: hidden;
  }
  .wa-audioplayer > audio { display: none !important; width: 0; height: 0; }
  .wa-audiobubble .wa-time { margin-top: .05rem; }
  .wa-playbtn { background: transparent; border: none; cursor: pointer; padding: 0; line-height: 1; color: var(--wa-header); flex-shrink: 0; }
  .wa-playbtn .material-icons-round { font-size: 38px; }
  .wa-msg.user .wa-playbtn { color: var(--wa-header-dark); }
  .wa-track { flex: 1; height: 4px; background: rgba(0,54,62,0.18); border-radius: 9999px; position: relative; cursor: pointer; }
  .wa-progress { height: 100%; background: var(--wa-header); border-radius: 9999px; position: absolute; top: 0; left: 0; width: 0; }
  .wa-track::after {
    content: ""; position: absolute; top: 50%; left: var(--thumb, 0%);
    width: 11px; height: 11px; border-radius: 50%; background: var(--wa-header);
    transform: translate(-50%, -50%); box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .wa-audiodur { font-size: .68rem; color: var(--wa-meta); min-width: 30px; text-align: right; }

  /* ---------- Typing indicator ---------- */
  #wa-typing { padding: 0 1rem .4rem; }
  .wa-typing-bubble { display: inline-flex; align-items: center; gap: .28rem; background: var(--wa-in-bubble);
    padding: .7rem .8rem; border-radius: 12px; border-top-left-radius: 3px; box-shadow: 0 1px 1.5px var(--wa-shadow); }
  .wa-typing-bubble span { width: 7px; height: 7px; background: #9fb4b9; border-radius: 50%; animation: waBounce 1.3s infinite ease-in-out both; }
  .wa-typing-bubble span:nth-child(1){ animation-delay: -.32s; }
  .wa-typing-bubble span:nth-child(2){ animation-delay: -.16s; }
  @keyframes waBounce { 0%,80%,100%{ transform: scale(.4); opacity:.5; } 40%{ transform: scale(1); opacity:1; } }

  /* ---------- Footer / input ---------- */
  .wa-footer { padding: .55rem .7rem calc(.55rem + env(safe-area-inset-bottom)); background: var(--wa-panel); flex-shrink: 0; }
  .wa-composer { display: flex; align-items: center; gap: .5rem; }
  .wa-textfield {
    flex: 1; display: flex; align-items: center;
    background: #fff; border-radius: 24px; padding: 0 .4rem 0 1rem;
    box-shadow: 0 1px 2px var(--wa-shadow);
  }
  .wa-textfield input[type="text"] {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 1rem; color: var(--wa-in-text); padding: .7rem 0; font-family: inherit;
  }
  .wa-textfield input::placeholder { color: #9aa6aa; }

  .wa-iconbtn {
    width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--wa-header), var(--wa-header-dark));
    color: #fff; display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer; transition: transform .15s, opacity .2s;
    box-shadow: 0 3px 8px rgba(0,54,62,.28);
  }
  .wa-iconbtn .material-icons-round { font-size: 24px; }
  .wa-iconbtn:hover { transform: scale(1.05); }
  .wa-iconbtn:active { transform: scale(.96); }
  .wa-iconbtn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .wa-fieldbtn {
    width: 40px; height: 40px; flex: 0 0 40px; border-radius: 50%;
    background: transparent; color: var(--wa-header); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .wa-fieldbtn:hover { background: rgba(0,104,119,0.08); }
  .wa-fieldbtn .material-icons-round { font-size: 25px; }

  /* ---------- Recording bar ---------- */
  .wa-recbar {
    flex: 1; display: none; align-items: center; gap: .6rem;
    background: #fff; border-radius: 24px; padding: .35rem .5rem .35rem 1rem;
    box-shadow: 0 1px 2px var(--wa-shadow);
  }
  .wa-recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--wa-rec); flex-shrink: 0; animation: waRecPulse 1.1s infinite; }
  @keyframes waRecPulse { 0%,100%{ opacity: 1; } 50%{ opacity: .25; } }
  .wa-rectime { font-variant-numeric: tabular-nums; color: var(--wa-in-text); font-size: .95rem; min-width: 44px; }
  .wa-rechint { flex: 1; color: #9aa6aa; font-size: .85rem; }
  .wa-reccancel { color: var(--wa-rec); }
  .wa-reccancel:hover { background: rgba(225,29,72,0.1); }

  .is-recording .wa-textfield,
  .is-recording #micButton,
  .is-recording #sendButton { display: none !important; }
  .is-recording .wa-recbar { display: flex; }
  .is-recording #recSendButton { display: flex !important; }

  #sendButton { display: none; }
  #recSendButton { display: none; }

  @media (max-width: 768px) {
    .wa-chat { max-width: 100%; box-shadow: none; }
  }

  /* ---------- Reduced motion ----------
     This is the page a client uses, on their own phone, possibly while unwell —
     the one surface in the product where a looping animation is least
     affordable. Not "no feedback": each moving thing keeps a still equivalent
     that survives a frozen frame.

     Arrival cross-fades instead of sliding. The travel is what causes trouble;
     the fade still marks that a message landed. */
  @media (prefers-reduced-motion: reduce) {
    .wa-msg { animation-name: waFadeSoft; }
    @keyframes waFadeSoft { from { opacity: 0; } }

    /* Both dots stop. Each has a companion that already carries the state
       without moving: the typing bubble is itself the "composing" signal, and
       the recording dot sits beside a timer that is visibly counting. A loop
       this slow is exactly the kind flagged as vestibular trouble, and neither
       is the only thing saying "now". */
    .wa-typing-bubble span { animation: none; opacity: .6; }
    .wa-recdot { animation: none; }

    /* Long programmatic scrolls are motion too, and this thread scrolls itself
       on every reply. */
    .wa-thread { scroll-behavior: auto; }

    /* The press still registers — only its easing goes, so the change lands in
       one step rather than over time. */
    .wa-iconbtn, .wa-fieldbtn { transition: none; }
    .wa-iconbtn:hover { transform: none; }
  }
</style>
