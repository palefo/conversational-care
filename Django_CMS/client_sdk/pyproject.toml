[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conversationalcare-api"
version = "0.1.0"
description = "Python client for the Conversational Care platform API."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://conversational-care.ai"

[tool.setuptools]
packages = ["conversationalcare_api"]
