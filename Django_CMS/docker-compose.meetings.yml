# Online meetings: the LiveKit media server and the meeting agents.
#
# Nothing here runs unless asked for — every service is in the `meetings`
# profile — so an installation that does not use online meetings pays no
# memory or CPU for them:
#
#   docker compose -f docker-compose.yml -f docker-compose.meetings.yml --profile meetings up -d
#
# Add `--profile edge` on a server that needs this stack to terminate TLS
# itself (browsers only give a web page the microphone over HTTPS).
#
# Sizing (idle → per active meeting), see online_meetings.md:
#   livekit       ~60 MB  → +5–10 MB and a little CPU per participant
#   agent-scribe  ~120 MB → +10 MB per recorded meeting (threads, no inference)
#   agent-voice   ~110 MB → +250–350 MB per agent in a meeting (one process each)
#
# Gated by the feature switch: each service runs under deploy/meetings-gate.sh,
# which keeps it parked (~1 MB) while online meetings are off — in Settings or
# ONLINE_MEETINGS_ENABLED — and starts it within a minute of switching them on.
# Switching off stops them once no meeting is open. MEETINGS_GATE=0 in .env
# runs them ungated, as before. Leaving out the profile still means no
# containers at all.
#
# Everything reads the same .env as the web app. Required there:
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET   any long random strings; shared by all three
#   LIVEKIT_URL         what browsers connect to, e.g. ws://localhost:7880 (dev)
#                       or wss://lk.example.org (with the edge profile)
#   LIVEKIT_API_URL     http://livekit:7880 — how the web app reaches LiveKit
#   MEETINGS_SERVICE_KEY  shared secret between the agents and the web app
#   LIVEKIT_NODE_IP     the IP browsers reach this machine on (dev: 127.0.0.1,
#                       or your LAN IP to test from a phone; a server: its public IP)

x-gate: &gate
  # A tiny init reaps whatever the service leaves behind and passes `docker
  # stop` on to the gate, which passes it on to the service.
  init: true

x-agents: &agents
  <<: *gate
  build: ./meeting_agents
  profiles: ["meetings"]
  entrypoint: ["sh", "/opt/meetings-gate.sh"]
  env_file:
    - .env
  environment: &agent-env
    # Agents join over the internal network, not the public URL browsers use.
    LIVEKIT_URL: ws://livekit:7880
    MEETINGS_INTERNAL_API_URL: http://web:8000
  volumes:
    # Recordings are written straight to the shared media volume, where the
    # web app's worker mixes them down. Same path in every container.
    - media_data:/media
    - ./deploy/meetings-gate.sh:/opt/meetings-gate.sh:ro
  depends_on:
    - livekit
    - web
  restart: unless-stopped

services:
  livekit:
    <<: *gate
    image: livekit/livekit-server:v1.13.9
    profiles: ["meetings"]
    entrypoint: ["sh", "/opt/meetings-gate.sh", "/livekit-server"]
    volumes:
      - ./deploy/meetings-gate.sh:/opt/meetings-gate.sh:ro
    environment:
      # For the gate (see the top of this file); LiveKit itself ignores them.
      MEETINGS_SERVICE_KEY: ${MEETINGS_SERVICE_KEY:-}
      MEETINGS_GATE: ${MEETINGS_GATE:-1}
      MEETINGS_GATE_POLL: ${MEETINGS_GATE_POLL:-60}
      MEETINGS_INTERNAL_API_URL: http://web:8000
      MEETINGS_GATE_NAME: livekit
      # livekit-server reads its whole configuration from LIVEKIT_CONFIG
      # (its --config-body flag), so the keys interpolate from .env here and
      # never sit in a file.
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          # One UDP port for all media: one firewall rule, and it works on
          # Docker Desktop, where publishing a 10,000-port range does not.
          udp_port: 7882
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
          # Keep the container's own address as a candidate too, so the agents
          # on the compose network reach it directly while browsers use the
          # node IP above.
          advertise_internal_ip: true
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        room:
          # Rooms are only ever created by the platform, never by a client.
          auto_create: false
          empty_timeout: 300
          departure_timeout: 60
          max_participants: 8
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://web:8000/meetings/hooks/livekit/
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          udp_port: 3478
          relay_range_start: 30000
          relay_range_end: 30020
    ports:
      - "${LIVEKIT_PUBLISH_PORT:-7880}:7880"     # signalling (WebSocket); behind the edge in production
      - "7881:7881"                              # ICE over TCP, for networks that block UDP
      - "7882:7882/udp"                          # all media
      - "3478:3478/udp"                          # TURN, when enabled
    restart: unless-stopped
    mem_limit: 512m

  agent-scribe:
    <<: *agents
    command: ["python", "-m", "cc_agents.scribe", "start"]
    environment:
      <<: *agent-env
      MEETINGS_GATE_NAME: agent-scribe
    mem_limit: 384m

  agent-voice:
    <<: *agents
    command: ["python", "-m", "cc_agents.voice", "start"]
    environment:
      <<: *agent-env
      # One process per live agent, started on demand; none kept warm.
      CC_VOICE_IDLE_PROCESSES: "0"
      MEETINGS_GATE_NAME: agent-voice
    mem_limit: 1g

  # TLS edge for a server with a domain (profile `edge`). Serves the app and
  # the LiveKit signalling endpoint with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2.8-alpine
    profiles: ["edge"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-lk.localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m

volumes:
  caddy_data:
